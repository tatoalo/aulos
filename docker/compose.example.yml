# See docs/operations.md for deployment and docs/integrations.md for optional services.
services:
  aulos:
    image: ghcr.io/tatoalo/aulos:latest
    platform: linux/amd64
    container_name: aulos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    # Allow active work to stop and SQLite to checkpoint before Docker sends SIGKILL.
    stop_grace_period: 60s
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      CHOWN_DIRS: "false"
      DOWNLOAD_DIR: /downloads
      AUDIO_DOWNLOAD_DIR: /downloads/audio
      STATE_DIR: /downloads/.metube
      TEMP_DIR: /downloads/.aulos-tmp
      MAX_CONCURRENT_DOWNLOADS: "3"
      SC_MAX_CONCURRENT_DOWNLOADS: "1"
      AULOS_WEB_UI: "true"
      DEFAULT_THEME: auto
      # Create this JSON file before enabling it.
      # YTDL_OPTIONS_FILE: /config/ytdl-options.json
      # Configure auth before exposing the port beyond localhost.
      # AULOS_API_TOKEN: ${AULOS_API_TOKEN}
    volumes:
      - ./downloads:/downloads
      - ./config:/config
