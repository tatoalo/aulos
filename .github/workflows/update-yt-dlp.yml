name: update-yt-dlp

# DESIGN §18.5. Tracks yt-dlp's **master** ("canary") channel, not the PyPI nightly: master builds
# are published to yt-dlp/yt-dlp-master-builds after every push to master, so the newest extractor
# fixes land here first. Ported from the legacy repo with the four hardening changes: the pin lives
# in one place (`docker/Dockerfile`'s `ARG YTDLP_VERSION=`, asserted exactly once), the PR is only
# opened after an amd64 image build plus offline checks, the commit message is machine-stable, and a
# fine-grained PAT is preferred with a graceful `GITHUB_TOKEN` fallback.
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

concurrency:
  group: bump-yt-dlp
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-yt-dlp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.AULOS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Assert the pin lives in exactly one place
        run: |
          set -eu
          n=$(grep -c 'ARG YTDLP_VERSION=' docker/Dockerfile)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one 'ARG YTDLP_VERSION=' in docker/Dockerfile, found $n"
            exit 1
          fi

      - name: Check for yt-dlp master builds
        id: update
        env:
          GH_TOKEN: ${{ secrets.AULOS_REPO_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          CURRENT_VERSION=$(grep -oE 'ARG YTDLP_VERSION=[^ ]+' docker/Dockerfile | sed 's/ARG YTDLP_VERSION=//')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not extract yt-dlp version from docker/Dockerfile"
            exit 1
          fi
          echo "Current version (docker/Dockerfile): $CURRENT_VERSION"

          # Master builds are release assets on yt-dlp/yt-dlp-master-builds, never on PyPI, so the
          # release tag *is* the pin and the tarball URL is derived from it.
          LATEST_VERSION=$(gh api repos/yt-dlp/yt-dlp-master-builds/releases/latest --jq .tag_name)
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "::error::Could not determine the latest yt-dlp master build tag"
            exit 1
          fi
          echo "Latest master build: $LATEST_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Update available: $CURRENT_VERSION -> $LATEST_VERSION"
            {
              echo "has_update=true"
              echo "current_version=$CURRENT_VERSION"
              echo "latest_version=$LATEST_VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            echo "yt-dlp is already up to date ($CURRENT_VERSION)"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the pin
        if: steps.update.outputs.has_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.update.outputs.latest_version }}
        run: |
          set -eu
          sed -i "s/^ARG YTDLP_VERSION=.*/ARG YTDLP_VERSION=$LATEST_VERSION/" docker/Dockerfile
          git diff docker/Dockerfile

      - name: Set up Docker Buildx
        if: steps.update.outputs.has_update == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image with the new pin
        if: steps.update.outputs.has_update == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            VERSION=bump-smoke
          tags: aulos-server:bump-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image tools and yt-dlp import
        if: steps.update.outputs.has_update == 'true'
        run: |
          set -eu
          docker run --rm aulos-server:bump-smoke doctor
          docker run --rm --entrypoint python3 aulos-server:bump-smoke \
            -c 'import yt_dlp; v = yt_dlp.version; print("yt_dlp", v.__version__, v.CHANNEL)'

      - name: Create or update the pull request
        if: steps.update.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.AULOS_REPO_PAT || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.AULOS_REPO_PAT != '' }}
          CURRENT_VERSION: ${{ steps.update.outputs.current_version }}
          LATEST_VERSION: ${{ steps.update.outputs.latest_version }}
        run: |
          set -eu
          BRANCH="auto/update-yt-dlp-master-${LATEST_VERSION}"

          git config user.email "updater@aulos"
          git config user.name "AutoUpdater"

          # Reuse the branch on a retry, otherwise create it. The pin edit is re-applied on the
          # branch rather than carried across the checkout, so the step is idempotent.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, reusing it"
            git checkout -- docker/Dockerfile
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -- docker/Dockerfile
            git checkout -b "$BRANCH"
          fi
          sed -i "s/^ARG YTDLP_VERSION=.*/ARG YTDLP_VERSION=$LATEST_VERSION/" docker/Dockerfile

          git add docker/Dockerfile
          if ! git diff --cached --quiet; then
            # One stable shape so the release body (`git log --pretty=%s`) reads as a run of bumps.
            git commit -m "upgrade yt-dlp master to $LATEST_VERSION"
          else
            echo "No new Dockerfile changes to commit"
          fi
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            LABEL_ARGS=""
            if gh api "repos/$GITHUB_REPOSITORY/labels/automated" >/dev/null 2>&1; then
              LABEL_ARGS="--label automated"
            else
              echo "Label 'automated' not found; creating PR without label"
            fi
            # shellcheck disable=SC2086
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --title "Upgrade yt-dlp master to $LATEST_VERSION" \
              --body "## Summary
          - Automated yt-dlp master (canary) build update
          - Build tag: $CURRENT_VERSION -> $LATEST_VERSION
          - The amd64 image build, tool checks and yt-dlp import passed with this pin.

          ---
          *This PR was automatically created by the update-yt-dlp workflow.*" $LABEL_ARGS)
          fi

          if [ "$HAVE_PAT" = "true" ]; then
            gh pr merge "$PR_URL" --auto --squash
          else
            echo "::warning::AULOS_REPO_PAT is not configured; opened $PR_URL without auto-merge"
          fi

      - name: Summary
        if: always()
        env:
          HAS_UPDATE: ${{ steps.update.outputs.has_update }}
          CURRENT_VERSION: ${{ steps.update.outputs.current_version }}
          LATEST_VERSION: ${{ steps.update.outputs.latest_version }}
        run: |
          {
            echo "## yt-dlp Master Build Update Check"
            echo ""
            if [ "${HAS_UPDATE:-false}" = "true" ]; then
              echo "**Status**: Update available"
              echo "**Current build**: $CURRENT_VERSION"
              echo "**Latest build**: $LATEST_VERSION"
              echo ""
              echo "A pull request has been created or updated."
            else
              echo "**Status**: Already up to date"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
