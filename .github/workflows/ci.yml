name: ci

# DESIGN §18.4, SIMPLIFIED by the BRIEF v1.0 scope trims: the `deny`, `coverage`, `schema` and
# `gitleaks` jobs are CUT.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies (BoringSSL/bindgen for the impersonating SC client)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies (BoringSSL/bindgen for the impersonating SC client)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - run: cargo test --workspace --locked
      # PLAN WP-08 requires both SC client feature combinations to run in CI. `--all-features`
      # above only ever exercises the impersonating `wreq` path; this is the plain `reqwest` one,
      # which is what runs wherever BoringSSL is unavailable.
      - run: cargo test -p aulos-provider-sc --no-default-features --locked

  arch:
    # The DESIGN §3 dependency-direction rules (A1-A5, WP-03) plus the WP-01 packaging gates: the
    # HEALTHCHECK shape, the single yt-dlp pin, and the amd64-only docker matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aulos-workspace-tests --locked
      - name: shellcheck every shipped shell script
        # `--severity=warning`: the e2e script uses `A && ok … || fail …` throughout, which is a
        # deliberate idiom there (both branches report) and which shellcheck flags at `info`.
        run: |
          shellcheck --severity=warning \
            docker/entrypoint.sh \
            tests/e2e/run.sh \
            crates/aulos-provider-ytdlp/tests/smoke_extract.sh
      - name: docker.yml builds linux/amd64 only
        run: |
          set -eu
          grep -q 'platforms: linux/amd64$' .github/workflows/docker.yml
          if grep -q 'linux/arm64' .github/workflows/docker.yml; then
            echo "::error::docker.yml must build linux/amd64 only (BRIEF §16)"; exit 1
          fi
          if grep -q 'setup-qemu-action' .github/workflows/docker.yml; then
            echo "::error::docker.yml must not set up QEMU (BRIEF §16)"; exit 1
          fi
      - name: the yt-dlp pin lives in exactly one place
        run: |
          set -eu
          n=$(grep -c 'ARG YTDLP_VERSION=' docker/Dockerfile)
          test "$n" -eq 1 || { echo "::error::yt-dlp pin appears $n times"; exit 1; }

  web:
    # The page shipped in `crates/aulos-api/web/` and its Playwright smoke (`tools/web/`).
    # Offline: the suite drives `tools/web/mock-server.mjs`, never a real server and never a
    # real download site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      - run: npm ci
        working-directory: tools/web
      - run: npx playwright install --with-deps chromium
        working-directory: tools/web
      - name: the shipped page stays under the 70 KB budget
        run: |
          set -eu
          n=$(cat crates/aulos-api/web/app.js crates/aulos-api/web/app.css | wc -c)
          echo "app.js + app.css = $n bytes"
          test "$n" -lt 71680 || { echo "::error::the shipped page is over the 70 KB budget"; exit 1; }
      - run: npx playwright test
        working-directory: tools/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: tools/web/screenshots
          if-no-files-found: warn

  python:
    # DESIGN §18.4. Present from day one so the required check exists; each step no-ops until the
    # file it needs lands (the shim in WP-07, the capture tooling in WP-00).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: ruff + py_compile the yt-dlp shim
        run: |
          set -eu
          shim=crates/aulos-provider-ytdlp/python/ytdlp_runner.py
          if [ ! -f "$shim" ]; then
            echo "::notice::$shim does not exist yet (WP-07); skipping"; exit 0
          fi
          pip install --quiet ruff
          ruff check "$shim"
          python -m py_compile "$shim"
      - name: shim contract test (canned job, stubbed yt_dlp)
        run: |
          set -eu
          t=crates/aulos-provider-ytdlp/tests/shim_contract.py
          if [ ! -f "$t" ]; then
            echo "::notice::$t does not exist yet (WP-07); skipping"; exit 0
          fi
          python "$t"
      - name: verify the golden corpora
        run: |
          set -eu
          if [ ! -f tools/capture/verify.py ]; then
            echo "::notice::tools/capture/verify.py does not exist yet (WP-00); skipping"; exit 0
          fi
          python tools/capture/verify.py
