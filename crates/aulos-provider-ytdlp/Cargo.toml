[package]
name = "aulos-provider-ytdlp"
description = "The yt-dlp provider: format/option construction and the Python shim client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
aulos-core = { workspace = true }
aulos-provider = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "net", "fs"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
nix = { workspace = true, features = ["signal", "process"] }
command-fds = { workspace = true, features = ["tokio"] }
url = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
insta = { workspace = true, features = ["json"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
