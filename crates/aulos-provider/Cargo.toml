[package]
name = "aulos-provider"
description = "The `Provider` trait, media entries, progress sink, registry and `command` plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# The scripted no-network provider used by the integration tests (DESIGN §20).
fake = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
aulos-core = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
toml = { workspace = true }
regex = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "resource"] }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The `fake` provider is exercised by this crate's own test suite, so the feature is on for tests.
aulos-provider = { workspace = true, features = ["fake"] }
