[package]
name = "aulos-hooks"
description = "Post-completion hooks: the dispatcher plus the jellyfin, nfo and audio-sync built-ins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
aulos-core = { workspace = true }
aulos-provider = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
time = { workspace = true, features = ["formatting", "macros"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
