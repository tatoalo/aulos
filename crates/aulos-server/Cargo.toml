[package]
name = "aulos-server"
description = "The aulos-server binary: wiring, the POT sidecar supervisor and signal handling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "aulos-server"

[lints]
workspace = true

[[bin]]
name = "aulos-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

aulos-core = { workspace = true }
aulos-store = { workspace = true }
aulos-provider = { workspace = true }
aulos-provider-ytdlp = { workspace = true }
aulos-provider-sc = { workspace = true }
aulos-queue = { workspace = true }
aulos-api = { workspace = true }
aulos-telegram = { workspace = true }
aulos-subscriptions = { workspace = true }
aulos-hooks = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "ansi"] }
reqwest = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
