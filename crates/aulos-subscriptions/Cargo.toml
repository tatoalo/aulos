[package]
name = "aulos-subscriptions"
description = "Subscription manager, per-subscription scheduler with jitter and backoff, and check algorithm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
aulos-core = { workspace = true }
aulos-store = { workspace = true }
aulos-provider = { workspace = true }
aulos-queue = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
rand = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
# The suite runs a real queue engine, whose `Engine::new` takes the `ArcSwap<YtdlOptions>` the
# binary owns; `arc-swap` is therefore a dev-only dependency here (the shipped crate reaches the
# same snapshot through `check::OptionsSource`, so DESIGN §3's row stays as written).
arc-swap = { workspace = true }
# The scripted, no-network provider (BRIEF §17).
aulos-provider = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
