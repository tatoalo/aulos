[package]
name = "aulos-telegram"
description = "The teloxide bot: commands, config UI, URL extraction and the live progress board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
aulos-core = { workspace = true }
aulos-store = { workspace = true }
aulos-queue = { workspace = true }
teloxide = { workspace = true, features = ["macros", "ctrlc_handler", "rustls"] }
governor = { workspace = true }
indexmap = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
